# FreezingArchRule: ghi lại vi phạm ĐANG CÓ vào archunit_store, rồi chỉ fail khi
# xuất hiện vi phạm MỚI. Nhờ vậy bật được luật ngay trên nợ kỹ thuật hiện tại,
# thay vì phải chờ dọn sạch mới bật — và nợ cũ nằm trong git nên đọc được.
freeze.store.default.allowStoreCreation=true
freeze.store.default.allowStoreUpdate=true
