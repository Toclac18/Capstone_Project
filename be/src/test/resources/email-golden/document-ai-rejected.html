<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin: 0; padding: 0; background-color: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #f5f5f5; padding: 40px 20px;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="max-width: 600px; background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">

          <!-- Header -->
          <tr>
            <td style="background-color: #FB8C00; padding: 40px 30px; text-align: center;">
              <p style="margin: 0 0 12px 0; font-size: 48px;">⚠️</p>
              <h1 style="margin: 0; color: #ffffff; font-size: 22px; font-weight: 600;">Document NOT APPROVED</h1>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding: 30px 30px 20px 30px;">
              <p style="margin: 0 0 16px 0; font-size: 16px; color: #333333;">Hello <strong>Nguyễn Văn A</strong>,</p>
              <p style="margin: 0; font-size: 15px; color: #666666; line-height: 1.6;">Your document could not be approved by our automated content review system.</p>
            </td>
          </tr>

          <!-- Document Card -->
          <tr>
            <td style="padding: 0 30px 20px 30px;">
              <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #F5F5F5; border-radius: 8px;">
                <tr>
                  <td style="padding: 16px;">
                    <p style="margin: 0 0 6px 0; font-size: 11px; color: #999999; text-transform: uppercase; letter-spacing: 1px;">Document Title</p>
                    <p style="margin: 0; font-size: 15px; color: #333333; font-weight: 600;">📄 Giáo trình Toán</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
  <td style="padding: 0 30px 20px 30px;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #FFF8E1; border-radius: 8px; border-left: 4px solid #FFC107;">
      <tr>
        <td style="padding: 16px;">
          <p style="margin: 0 0 6px 0; font-size: 13px; font-weight: 600; color: #F57C00;">📝 Details</p>
          <p style="margin: 0; font-size: 14px; color: #5D4037; line-height: 1.5;">Ảnh không phù hợp</p>
        </td>
      </tr>
    </table>
  </td>
</tr>

          

          <!-- CTA Button -->
          <tr>
            <td style="padding: 10px 30px 30px 30px; text-align: center;">
              <a href="https://app.test" style="display: inline-block; background-color: #FB8C00; color: #ffffff; padding: 14px 36px; border-radius: 6px; text-decoration: none; font-size: 14px; font-weight: 600;">Go to Readee</a>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background-color: #FAFAFA; padding: 20px 30px; text-align: center; border-top: 1px solid #EEEEEE;">
              <p style="margin: 0 0 4px 0; font-size: 12px; color: #999999;">© 2025 Readee Platform. All rights reserved.</p>
              <p style="margin: 0; font-size: 11px; color: #BBBBBB;">This is an automated message, please do not reply.</p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
