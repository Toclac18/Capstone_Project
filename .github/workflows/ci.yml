name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

jobs:
  changes:
    name: Detect changed projects
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ai: ${{ steps.filter.outputs.ai }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1 # Only lastest commit

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'be/**'
            frontend:
              - 'fe/**'
            ai:
              - 'ai/**'

  backend:
    name: Backend - Gradle Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: be
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      # Chạy luôn test, trong đó có guardrail ArchUnit
      # (be/src/test/java/com/capstone/be/architecture/ArchitectureTest.java)
      - name: Run Gradle build
        run: ./gradlew build

      # Báo cáo test khi fail: không có cái này thì log CI chỉ nói "test failed"
      # mà không nói luật kiến trúc nào bị vi phạm.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: |
            be/build/reports/tests/test
            be/build/test-results/test
          retention-days: 7

  frontend:
    name: Frontend - Next.js Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: fe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Install dependencies
        run: npm ci

      # next-env.d.ts và .next/types/ đều bị gitignore, mà khai báo module cho
      # *.svg nằm trong đó (next/image-types/global). Không sinh lại thì tsc báo
      # TS2307 cho mọi import ảnh — lần CI đầu của PR này fail đúng vì vậy.
      # next build cũng sinh chúng, nhưng Typecheck chạy trước build nên phải tự sinh.
      - name: Generate Next types
        run: npx next typegen

      # Typecheck trước build: nhanh hơn nhiều nên lỗi kiểu hiện ra sớm.
      # (next build cũng typecheck, bước này chỉ để fail nhanh.)
      - name: Typecheck
        run: npx tsc --noEmit

      # Ngân sách warning: 0 error, và KHÔNG được vượt số warning hiện tại.
      # Không bắt dọn 408 warning đang có, nhưng chặn con số đó tăng.
      # Dọn bớt được thì hạ số này xuống — xem docs/architecture/04-conventions.md §7.
      - name: Lint
        run: npx eslint . --ext .js,.jsx,.ts,.tsx --max-warnings 408

      - name: Build
        run: npm run build

  ai:
    name: AI - Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Trước PR này ai/ không được CI chạm tới chút nào.
      # Chỉ kiểm cú pháp và lỗi chắc chắn — không cài requirements.txt
      # (cần GPU/torch, quá nặng cho CI) nên không chạy được test thật.
      - name: Compile check
        run: python -m compileall -q ai/Readee_AI_System/src ai/OCR_Service/src

      - name: Ruff (chỉ lỗi thật)
        run: |
          pip install --quiet ruff==0.8.4
          # E9  = lỗi cú pháp / thụt lề
          # F63 = so sánh sai kiểu
          # F7  = câu lệnh sai chỗ (break ngoài loop...)
          # F82 = dùng tên chưa định nghĩa
          # Tập này gần như không có false positive. Mở rộng dần khi ai/ được dọn.
          ruff check --select=E9,F63,F7,F82 ai/
