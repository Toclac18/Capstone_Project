name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

jobs:
  changes:
    name: Detect changed projects
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ai: ${{ steps.filter.outputs.ai }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1 # Only lastest commit

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'be/**'
            frontend:
              - 'fe/**'
            ai:
              - 'ai/**'

  backend:
    name: Backend - Gradle Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: be
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      # Chạy luôn test, trong đó có guardrail ArchUnit
      # (be/src/test/java/com/capstone/be/architecture/ArchitectureTest.java)
      - name: Run Gradle build
        run: ./gradlew build

      # Báo cáo test khi fail: không có cái này thì log CI chỉ nói "test failed"
      # mà không nói luật kiến trúc nào bị vi phạm.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: |
            be/build/reports/tests/test
            be/build/test-results/test
          retention-days: 7

  frontend:
    name: Frontend - Next.js Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: fe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Install dependencies
        run: npm ci

      # next-env.d.ts và .next/types/ đều bị gitignore, mà khai báo module cho
      # *.svg nằm trong đó (next/image-types/global). Không sinh lại thì tsc báo
      # TS2307 cho mọi import ảnh — lần CI đầu của PR này fail đúng vì vậy.
      # next build cũng sinh chúng, nhưng Typecheck chạy trước build nên phải tự sinh.
      - name: Generate Next types
        run: npx next typegen

      # Typecheck trước build: nhanh hơn nhiều nên lỗi kiểu hiện ra sớm.
      # (next build cũng typecheck, bước này chỉ để fail nhanh.)
      - name: Typecheck
        run: npx tsc --noEmit

      # Ngân sách warning: 0 error, và KHÔNG được vượt số warning hiện tại.
      # Không bắt dọn 353 warning đang có, nhưng chặn con số đó tăng.
      # Dọn bớt được thì hạ số này xuống — xem docs/architecture/04-conventions.md §7.
      - name: Lint
        run: npx eslint . --ext .js,.jsx,.ts,.tsx --max-warnings 353

      # vitest đã cài và `npm test` đã có trong package.json từ trước, nhưng
      # CI chưa bao giờ gọi — 16 test trong src/server/bff.test.ts chạy xanh ở
      # máy mà không chặn được gì. Giống hệt chuyện `gradle build` có cổng test
      # mà src/test chỉ có ExampleTest (xem 01-assessment.md P2-13).
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  ai:
    name: AI - Test & Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # requirements.txt cần torch/GPU nên CI không cài được. Thay vào đó cài
      # requirements-dev.txt (pytest + fastapi, không torch): test ở
      # ai/Readee_AI_System/tests stub các lib ML để chạy không cần model.
      - name: Install dev dependencies
        run: pip install --quiet -r ai/Readee_AI_System/requirements-dev.txt

      - name: Compile check
        run: python -m compileall -q ai/Readee_AI_System/src ai/OCR_Service/src

      # Chạy local thì dùng đúng 3.11 như ở đây. Từ Python 3.14 (PEP 649)
      # annotation được evaluate lười, nên annotation lỗi im lặng trên máy
      # dev 3.14 mà làm vỡ import ở bước này.
      # tests/test_annotations_resolve.py chặn đúng lớp lỗi đó.
      - name: Pytest
        working-directory: ai/Readee_AI_System
        run: python -m pytest

      # Tập luật siết lên sau khi ai/ đã dọn sạch (PR này). Trước đó chỉ có
      # E9,F63,F7,F82 vì còn 45 vi phạm. Siết theo trạng thái sau khi gộp:
      #   F   = pyflakes đủ bộ (import/biến không dùng, tên chưa định nghĩa)
      #   E4  = import sai chỗ
      #   E7  = so sánh/câu lệnh sai (== None, except trần, l làm tên biến)
      #   E9  = lỗi cú pháp / thụt lề
      #   B   = bugbear (raise mất nguyên nhân, biến vòng lặp không dùng...)
      #   SIM = đơn giản hoá chắc chắn đúng
      # Bỏ B008: `File(...)` trong default tham số là idiom chuẩn của FastAPI.
      # Chưa bật UP (pyupgrade): còn 105 chỗ `Dict`/`List` trong summary/,
      # đổi hết thành một commit ồn mà không sửa gì thật.
      - name: Ruff
        run: ruff check --select=F,E4,E7,E9,B,SIM --ignore=B008 ai/
